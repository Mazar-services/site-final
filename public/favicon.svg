<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Mazar Services">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1248a0"/>
      <stop offset="100%" stop-color="#071a38"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0ba5c"/>
      <stop offset="100%" stop-color="#b88324"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fond arrondi bleu marine profond -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>

  <!-- Bordure subtile dorée -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity="0.45"/>

  <!-- Forme M stylisée — trait blanc épais, lisible même à 16px -->
  <path d="M26 90 L46 36 L64 66 L82 36 L102 90"
        fill="none"
        stroke="#ffffff"
        stroke-width="11"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Accent doré bas droite (signature) -->
  <line x1="81" y1="90" x2="102" y2="90"
        stroke="url(#gold)"
        stroke-width="9.5"
        stroke-linecap="round"/>

  <!-- Point doré haut gauche -->
  <circle cx="26" cy="36" r="6" fill="url(#gold)"/>
</svg>
