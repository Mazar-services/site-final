    <!-- JSON-LD FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "En combien de temps répondez-vous ?",
          "acceptedAnswer": { "@type": "Answer", "text": "Nous répondons sous 24h ouvrées dans la majorité des cas." }
        },
        {
          "@type": "Question",
          "name": "Intervenez-vous pour les particuliers ?",
          "acceptedAnswer": { "@type": "Answer", "text": "Notre priorité est le nettoyage professionnel (entreprises, commerces et copropriétés), mais certaines demandes particulières peuvent être étudiées au cas par cas." }
        },
        {
          "@type": "Question",
          "name": "Faites-vous des prestations régulières ?",
          "acceptedAnswer": { "@type": "Answer", "text": "Oui, nous proposons des contrats réguliers adaptés à votre fréquence, vos horaires et votre type de structure." }
        },
        {
          "@type": "Question",
          "name": "Comment obtenir un devis ?",
          "acceptedAnswer": { "@type": "Answer", "text": "Complétez le formulaire de devis ou envoyez un email avec le type de local, l'adresse, la surface approximative et la fréquence souhaitée." }
        },
        {
          "@type": "Question",
          "name": "Quelle zone couvrez-vous ?",
          "acceptedAnswer": { "@type": "Answer", "text": "Nous intervenons sur Grenoble, le bassin grenoblois, le Grésivaudan et les communes voisines." }
        },
        {
          "@type": "Question",
          "name": "Quels produits utilisez-vous ?",
          "acceptedAnswer": { "@type": "Answer", "text": "Nous utilisons des produits professionnels certifiés, adaptés à chaque type de surface. Des alternatives éco-responsables peuvent être proposées sur demande." }
        },
        {
          "@type": "Question",
          "name": "Comment se déroule la première intervention ?",
          "acceptedAnswer": { "@type": "Answer", "text": "Après validation du devis, nous planifions ensemble la première intervention selon vos horaires et contraintes. Un suivi est assuré dès le départ." }
        }
      ]
    }
    </script>
